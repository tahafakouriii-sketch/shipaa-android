name: Build Shipaa Android APK
on:
  push:
    branches:
      - main
      - feature/mobile-learning-shell-v02
    paths:
      - 'android-app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle :android-app:assembleDebug --no-daemon
      - name: Validate APK
        run: |
          APK=android-app/build/outputs/apk/debug/android-app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: shipaa-mobile-pilot-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
