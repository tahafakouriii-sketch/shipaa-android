name: Unified Shipaa Android preview
on:
  push:
    branches: [feat/unified-web-native-offline-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble preview APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipaa-unified-native-offline-preview
          path: app/build/outputs/apk/debug/app-debug.apk
