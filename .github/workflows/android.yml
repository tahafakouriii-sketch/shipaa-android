name: Shipaa native APK
on:
  workflow_dispatch:
  push:
    branches: [main, feat/native-learning-offline, feat/shipaa-1-0]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check server bridge
        run: |
          php -l server/native-api.php
          php server/test-native-api.php
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare installed Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Shipaa-1.0-beta1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
  ui-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /data/local/tmp/shipaa-ui ui-proof
      - name: Preview evidence
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,base64
          for p in pathlib.Path('ui-proof').glob('*.jpg'):
              print('SHIPAA_IMAGE_'+p.stem+'_BEGIN'+base64.b64encode(p.read_bytes()).decode()+'SHIPAA_IMAGE_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shipaa-UI-verification
          path: |
            ui-proof
            app/build/reports/androidTests
